# StorageCloud (web-storage) behind nginx with Let's Encrypt.
# Install:
#   sudo cp deploy/nginx/storecloud.conf /etc/nginx/sites-available/storecloud
#   sudo ln -sf /etc/nginx/sites-available/storecloud /etc/nginx/sites-enabled/storecloud
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d storecloud.my.id -d www.storecloud.my.id
# Requires A/AAAA records pointing at this server BEFORE certbot runs.

server {
    listen 80;
    listen [::]:80;
    server_name storecloud.my.id www.storecloud.my.id;

    # ACME + everything else (certbot --nginx will add the 443 block itself).
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { try_files $uri @proxy; }

    location @proxy {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 102m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
